services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tarevity
      POSTGRES_DB: tarevity
      # Local-only database bound to 127.0.0.1, so it accepts connections without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - tarevity-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
    depends_on:
      - redis

volumes:
  tarevity-pg:
